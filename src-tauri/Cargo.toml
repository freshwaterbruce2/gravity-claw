[package]
name = "gravity-claw"
version = "0.2.0"
description = "AI agent orchestrator desktop application"
authors = ["Bruce Freshwater"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "gravity_claw_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
devtools = ["tauri/devtools"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
keyring = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.40.0", features = ["rt-multi-thread", "io-util", "sync", "macros", "process", "time", "net", "fs"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s" # Optimized for size; benchmark against "3" if CPU-bound
strip = true
panic = "unwind"

# All dependency crates: opt-level=0 + 256 codegen-units + sequential LLVM threads.
# Rationale (rust-lang/rust#70035, Tauri issue #13638):
#  - opt-level=0 -> ~40% less peak LLVM memory per crate vs opt-level=1
#  - codegen-units=256 -> each unit is 1/256 of total IR
#  - jobs=1 (in .cargo/config.toml) -> LLVM processes those 256 units one at a time
#  - incremental=false -> no incremental cache memory overhead
[profile.release.package."*"]
opt-level = 0
codegen-units = 256
incremental = false
